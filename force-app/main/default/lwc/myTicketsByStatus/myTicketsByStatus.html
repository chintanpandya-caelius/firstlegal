<template>
    <lightning-card>
        <div class="card-container">
            <!-- Header -->
            <div class="chart-header">
                <span class="chart-title">My Tickets by Status</span>
                <span class="chart-timestamp">
                    <template if:true={lastRefreshed}>
                        As of {lastRefreshed}
                    </template>
                </span>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Error State -->
            <template if:true={error}>
                <div class="error-container">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <span class="error-text">Unable to load ticket data. Please try again.</span>
                </div>
            </template>

            <!-- Chart -->
            <template if:false={isLoading}>
                <template if:true={hasData}>
                    <div class="chart-wrapper">
                        <!-- X-Axis Label -->
                        <div class="x-axis-label">Record Count</div>

                        <!-- X-Axis Tick Marks -->
                        <div class="x-axis-ticks">
                            <span class="tick tick-0">0</span>
                            <span class="tick tick-1">1</span>
                            <span class="tick tick-2">2</span>
                            <span class="tick tick-3">3</span>
                            <span class="tick tick-4">4</span>
                            <span class="tick tick-5">5</span>
                        </div>

                        <!-- Grid Lines -->
                        <div class="grid-lines">
                            <div class="grid-line" style="left: 0%"></div>
                            <div class="grid-line" style="left: 20%"></div>
                            <div class="grid-line" style="left: 40%"></div>
                            <div class="grid-line" style="left: 60%"></div>
                            <div class="grid-line" style="left: 80%"></div>
                            <div class="grid-line" style="left: 100%"></div>
                        </div>

                        <!-- Bars -->
                        <div class="bars-container">
                            <template for:each={chartData} for:item="row">
                                <div key={row.id} class="bar-row">
                                    <span class="bar-label">{row.status}</span>
                                    <div class="bar-track">
                                        <div
                                            class="bar-fill"
                                            style={row.barStyle}
                                            role="img"
                                            aria-label={row.ariaLabel}
                                        ></div>
                                        <span class="bar-count">{row.count}</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- Empty State -->
                <template if:false={hasData}>
                    <div class="empty-state">
                        <lightning-icon icon-name="utility:check" size="large" variant="success"></lightning-icon>
                        <p>No tickets assigned to you.</p>
                    </div>
                </template>
            </template>

            <!-- Footer -->
            <template if:true={hasData}>
                <div class="chart-footer">
                    <!-- <span class="total-label">Total Tickets: <strong>{totalTickets}</strong></span> -->
                    <span class="total-label">Filtered to your account. Statuses: {statusString}</span>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        title="Refresh"
                        onclick={handleRefresh}
                        variant="bare"
                        size="small"
                    ></lightning-button-icon>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
