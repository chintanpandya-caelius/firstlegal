<template>
    <section
        class="slds-modal slds-fade-in-open"
        role="dialog"
        aria-modal="true"
    >
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button
                    class="slds-button slds-button_icon slds-modal__close"
                    title="Close"
                    onclick={handleClose}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        size="small"
                        alternative-text="Close"
                    ></lightning-icon>
                </button>
                <h2 class="slds-text-heading_medium">Export Tickets</h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={isLoading}>
                    <lightning-spinner
                        alternative-text="Loading"
                        size="small"
                    ></lightning-spinner>
                </template>

                <template if:false={isLoading}>
                    <template if:true={errorMessage}>
                        <div class="slds-text-color_error slds-m-bottom_small">
                            {errorMessage}
                        </div>
                    </template>

                    <p class="slds-text-title_bold slds-m-bottom_x-small">
                        Export as
                    </p>
                    <div class="slds-form-element slds-m-bottom_medium">
                        <span class="slds-radio">
                            <input
                                type="radio"
                                name="format"
                                value="CSV"
                                checked={isCsv}
                                onchange={handleFormatChange}
                                id="format-csv"
                            />
                            <label class="slds-radio__label" for="format-csv">
                                <span class="slds-radio_faux"></span>
                                <span class="slds-form-element__label">CSV</span>
                            </label>
                        </span>
                        <span class="slds-radio slds-m-left_large">
                            <input
                                type="radio"
                                name="format"
                                value="EXCEL"
                                onchange={handleFormatChange}
                                id="format-excel"
                            />
                            <label class="slds-radio__label" for="format-excel">
                                <span class="slds-radio_faux"></span>
                                <span class="slds-form-element__label">Excel</span>
                            </label>
                        </span>
                    </div>

                    <p class="slds-text-title_bold slds-m-bottom_x-small">
                        Select field
                    </p>
                    <div class="slds-grid slds-wrap slds-gutters_small">
                        <template for:each={fields} for:item="field">
                            <div
                                key={field.apiName}
                                class="slds-col slds-size_1-of-3 slds-m-bottom_small"
                            >
                                <span class="slds-checkbox">
                                    <input
                                        type="checkbox"
                                        checked={field.isSelected}
                                        data-field={field.apiName}
                                        onchange={handleFieldToggle}
                                        id={field.apiName}
                                    />
                                    <label
                                        class="slds-checkbox__label"
                                        for={field.apiName}
                                    >
                                        <span class="slds-checkbox_faux"></span>
                                        <span class="slds-form-element__label">
                                            {field.label}
                                        </span>
                                    </label>
                                </span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <button
                    class="slds-button slds-button_neutral"
                    onclick={handleClose}
                >
                    Close
                </button>
                <button
                    class="slds-button slds-button_brand"
                    onclick={handleExportClick}
                >
                    Export
                </button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
