<template>
    <lightning-card title="To Do List" icon-name="standard:task">
        <div class="slds-p-around_x-small">
            
            <!-- Uses slds-wrap so columns stack vertically in small page regions -->
            <div class="slds-grid slds-wrap slds-gutters_x-small">
                
                <!-- Today's Tasks Section -->
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                    <div class="slds-box slds-box_x-small">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                            <span class="slds-text-title_bold">
                                📅 Today ({todayCount})
                            </span>
                            <template if:true={hasTodayActivities}>
                                <lightning-button 
                                    label="View All" 
                                    variant="base" 
                                    onclick={openTodayModal}>
                                </lightning-button>
                            </template>
                        </div>

                        <template if:true={hasTodayActivities}>
                            <div class="datatable-container">
                                <lightning-datatable
                                    key-field="recordId"
                                    data={previewTodayActivities}
                                    columns={todayColumns}
                                    hide-checkbox-column
                                    column-widths-mode="auto"
                                    onrowaction={handleRowAction}>
                                </lightning-datatable>
                            </div>
                        </template>
                        <template if:false={hasTodayActivities}>
                            <p class="slds-text-color_weak slds-p-around_x-small slds-text-align_center">No items due today.</p>
                        </template>
                    </div>
                </div>

                <!-- Overdue Tasks Section -->
                <div class="slds-col slds-size_1-of-1">
                    <div class="slds-box slds-box_x-small">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                            <span class="slds-text-title_bold slds-text-color_error">
                                ⚠️ Overdue ({overdueCount})
                            </span>
                            <template if:true={hasOverdueActivities}>
                                <lightning-button 
                                    label="View All" 
                                    variant="base" 
                                    onclick={openOverdueModal}>
                                </lightning-button>
                            </template>
                        </div>

                        <template if:true={hasOverdueActivities}>
                            <div class="datatable-container">
                                <lightning-datatable
                                    key-field="recordId"
                                    data={previewOverdueActivities}
                                    columns={overdueColumns}
                                    hide-checkbox-column
                                    column-widths-mode="auto"
                                    onrowaction={handleRowAction}>
                                </lightning-datatable>
                            </div>
                        </template>
                        <template if:false={hasOverdueActivities}>
                            <p class="slds-text-color_weak slds-p-around_x-small slds-text-align_center">🎉 No overdue items!</p>
                        </template>
                    </div>
                </div>

            </div>
        </div>
    </lightning-card>

    <!-- VIEW ALL POPUP MODAL -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
                        {modalTitle} ({modalData.length})
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-datatable
                        key-field="recordId"
                        data={modalData}
                        columns={modalColumns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" variant="neutral" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
